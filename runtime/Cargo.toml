[package]
name = "zakuro-wiiu-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Zakuro as a Wii U runtime: the emulator core a recompiled 3DS title links against, driven by the C platform layer in ../platform"
publish = false

[lib]
name = "zakuro_wiiu"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
# gx2: the 3D on the Wii U's GPU when the platform layer offers it, see
# ZwParams::renderer
zakuro-core = { path = "../zakuro/crates/zakuro-core", default-features = false, features = ["gx2"] }
zakuro-common = { path = "../zakuro/crates/zakuro-common" }
zakuro-fs = { path = "../zakuro/crates/zakuro-fs" }
log = "0.4"
# the GPU's worker threads, set up here to place them on the cores
rayon = "1.12"

# a project of its own, outside zakuro's workspace
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
debug = 0

[profile.dev]
panic = "abort"
opt-level = 2
