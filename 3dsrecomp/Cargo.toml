[package]
name = "recomp3ds"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Static recompilation toolkit for the Nintendo 3DS"

[[bin]]
name = "3dsrecomp"
path = "src/main.rs"

[workspace]
members = ["abi"]

[features]
# loading a recompiled library from Rust
host = ["recomp-abi/load"]
# checking recompiled code against Zakuro's interpreter, which it fetches
verify = ["host", "dep:zakuro-cpu"]

[dependencies]
recomp-abi = { path = "abi", default-features = false }
zakuro-cpu = { git = "https://github.com/fearkov/zakuro", optional = true }
# decrypting retail dumps with the user's own keys, see src/crypto.rs
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
debug = 1
