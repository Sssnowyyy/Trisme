[package]
name = "zakuro-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["vulkan", "jit"]
# the GPU's Vulkan backend; a frontend drawing with the software rasterizer
# (the Wii U's) turns default features off
vulkan = ["zakuro-gpu/vulkan"]
# the Wii U's GPU through GX2, see Config::gx2_renderer; the program links
# in the platform layer's side, platform/zw_gx2.h
gx2 = ["zakuro-gpu/gx2"]
# shaders compiled with cranelift rather than interpreted
jit = ["zakuro-gpu/jit"]

[dependencies]
symphonia-codec-aac = "0.6"
symphonia-core = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zakuro-common.workspace = true
zakuro-cpu.workspace = true
zakuro-fs.workspace = true
zakuro-gpu = { path = "../zakuro-gpu", default-features = false }
log.workspace = true
serde.workspace = true
# saved states, the state as postcard writes it and memory, both in LZ4
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
lz4_flex = "0.14.0"
# the hash a local wireless beacon carries of its network
sha1 = "0.11.0"
thiserror.workspace = true
bitflags.workspace = true
recomp-abi.workspace = true
rayon.workspace = true
ab_glyph = "0.2"

# libraries of recompiled code opened while running, which the Wii U has no
# dynamic loader for
[target.'cfg(not(target_vendor = "wiiu"))'.dependencies]
recomp-abi = { workspace = true, features = ["load"] }

[dev-dependencies]
env_logger = "0.11"
zakuro-fs = { workspace = true, features = ["testing"] }

[lints.rust]
# the Wii U target's vendor, which code for it is gated on
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("wiiu"))'] }
