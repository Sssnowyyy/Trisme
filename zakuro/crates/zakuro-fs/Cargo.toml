[package]
name = "zakuro-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# builders of NCCH and CIA files, for the tests of the crates that read them
testing = []

[dependencies]
zakuro-common.workspace = true
log.workspace = true
thiserror.workspace = true
crc32fast = "1"

# the ROM mapped rather than read; the Wii U has no mmap
[target.'cfg(not(target_vendor = "wiiu"))'.dependencies]
memmap2.workspace = true

[lints.rust]
# the Wii U target's vendor, which code for it is gated on
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("wiiu"))'] }
